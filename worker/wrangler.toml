# Pembroke Academy — hosted character-AI gateway.
# Deploy:  cd worker && npx wrangler deploy
# The AI binding needs no API key: inference runs on your Cloudflare
# account's Workers AI allocation, and its plan limits are the hard
# cost ceiling for this endpoint.
name = "pembroke-ai"
main = "src/index.mjs"
compatibility_date = "2026-08-01"

[ai]
binding = "AI"

[vars]
# The ONE origin allowed to talk to this gateway (plus localhost dev).
ALLOWED_ORIGIN = "https://justinlooney.github.io"
# Kill switch: set to "0" (wrangler deploy --var AI_ENABLED:0, or the
# dashboard) and every request answers 503 while the campus falls back
# to canned dialogue. No redeploy of the site needed.
AI_ENABLED = "1"
# The stream's two clocks, in milliseconds — how long a live stream may
# go silent, and how long it may run at all. Optional: the code carries
# the same defaults, and these exist so an operator can tighten them
# from the dashboard without a deploy. They are what guarantees a
# response ends; the 30s handler timeout only guards startup.
# AI_IDLE_MS  = "15000"
# AI_TOTAL_MS = "120000"

# Per-IP rate limit: 8 requests per minute burst protection.
[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "1101"
simple = { limit = 8, period = 60 }
