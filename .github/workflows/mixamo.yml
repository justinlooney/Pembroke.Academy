name: mixamo

# Turns a list of Drive links into an animated character, on GitHub's
# servers. Mixamo needs a browser login, so the download cannot be
# automated — but everything after it can, and doing it here means no
# Blender, no venv and no laptop in the loop. Edit tools/mixamo-inbox.txt
# (the web editor on a phone is enough), commit, and collect the GLB.
on:
  push:
    paths: ['tools/mixamo-inbox.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency: mixamo

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read the inbox
        id: inbox
        run: |
          # strip comments and blanks; anything left is "name  url"
          grep -vE '^\s*(#|$)' tools/mixamo-inbox.txt > /tmp/entries || true
          count=$(wc -l < /tmp/entries)
          echo "entries=$count" >> "$GITHUB_OUTPUT"
          out=$(sed -n 's/^#\s*out:\s*//p' tools/mixamo-inbox.txt | head -1)
          echo "out=${out:-assets/stu_walker.glb}" >> "$GITHUB_OUTPUT"
          if [ "$count" -lt 2 ]; then
            echo "Inbox has $count entry(s). Needs a character plus at least one"
            echo "animation, so there is nothing to do yet — this is not a failure."
          else
            echo "Will fetch $count file(s) into ${out:-assets/stu_walker.glb}"
            cat /tmp/entries
          fi

      - name: Fetch from Drive
        if: steps.inbox.outputs.entries >= 2
        run: |
          mkdir -p /tmp/fbx
          fail=0
          while read -r name url; do
            [ -z "$name" ] && continue
            id=$(sed -n 's#.*/d/\([^/]*\).*#\1#p' <<<"$url")
            if [ -z "$id" ]; then
              echo "::error::$name — could not read a file id out of: $url"
              fail=1; continue
            fi
            curl -sL "https://drive.google.com/uc?export=download&id=$id" -o "/tmp/fbx/$name.fbx"
            # Drive answers a login page with HTTP 200, so the only honest
            # test is whether the bytes are actually an FBX.
            if head -c 20 "/tmp/fbx/$name.fbx" | grep -q "Kaydara"; then
              printf '  ok   %-18s %s\n' "$name" "$(du -h "/tmp/fbx/$name.fbx" | cut -f1)"
            else
              echo "::error::$name is not an FBX — share it as 'Anyone with the link'"
              rm -f "/tmp/fbx/$name.fbx"; fail=1
            fi
          done < /tmp/entries
          exit $fail

      - name: Install Blender
        if: steps.inbox.outputs.entries >= 2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender >/dev/null
          blender --version | head -1

      - name: Convert
        if: steps.inbox.outputs.entries >= 2
        run: |
          # character first, animations after — the order in the inbox
          args=$(while read -r name url; do printf '/tmp/fbx/%s.fbx ' "$name"; done < /tmp/entries)
          blender --background --python-exit-code 1 \
                  --python tools/mixamo-to-glb.py -- "${{ steps.inbox.outputs.out }}" $args

      - name: Shrink it
        if: steps.inbox.outputs.entries >= 2
        run: |
          npm install -g --silent @gltf-transform/cli
          before=$(stat -c%s "${{ steps.inbox.outputs.out }}")
          # Textures and vertex data only. Simplification rewrites the mesh
          # and takes the skin weights with it, and joining merges the nodes
          # the skeleton is bound to — either one turns a walking student
          # into a bag of knots.
          gltf-transform optimize "${{ steps.inbox.outputs.out }}" "${{ steps.inbox.outputs.out }}" \
            --compress meshopt --texture-compress webp --texture-size 1024 \
            --simplify false --join false
          after=$(stat -c%s "${{ steps.inbox.outputs.out }}")
          echo "$before $after" | awk '{printf "%.1fMB -> %.1fMB\n", $1/1e6, $2/1e6}'

      - name: Bump the cache version
        if: steps.inbox.outputs.entries >= 2
        run: |
          # assets/ changed, so returning visitors would otherwise keep the
          # old campus forever — and the PR guard would fail the build.
          cur=$(sed -n 's/^const VERSION = "pembroke-v\([0-9]*\)";$/\1/p' sw.js)
          sed -i "s/^const VERSION = \"pembroke-v$cur\";$/const VERSION = \"pembroke-v$((cur+1))\";/" sw.js
          grep '^const VERSION' sw.js

      - name: Commit
        if: steps.inbox.outputs.entries >= 2
        run: |
          git config user.name "pembroke-asset-courier"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ steps.inbox.outputs.out }}" sw.js
          git commit -m "Courier: build $(basename "${{ steps.inbox.outputs.out }}") from Mixamo" \
            || { echo "nothing changed"; exit 0; }
          git push origin HEAD:${{ github.ref_name }}
