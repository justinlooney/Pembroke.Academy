name: mixamo

# Turns Drive links into animated characters, on GitHub's servers. Mixamo
# needs a browser login, so the download cannot be automated — but
# everything after it can, and doing it here means no Blender, no venv and
# no laptop in the loop. Edit tools/mixamo-inbox.txt (the web editor on a
# phone is enough), commit, and collect the models.
on:
  push:
    paths: ['tools/mixamo-inbox.txt']
  workflow_dispatch:

permissions:
  contents: write
  actions: write        # to ask smoke to run on the commit this makes

concurrency: mixamo

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # --since below diffs the inbox against the push

      # Build what this push edited, not the whole file. Every block used
      # to be rebuilt on every run, which re-downloads each character and
      # overwrites whatever has happened to it since — the metalrough
      # conversion that recovered two bodies' colour, the idle clips the
      # other courier landed. Adding one clip to one student should not
      # put the other eight back to their download.
      #
      # workflow_dispatch has no "before", so a manual run still builds
      # everything, which is the escape hatch when that is what you want.
      - name: Read the inbox
        id: plan
        run: |
          before='${{ github.event.before }}'
          case "$before" in
            ''|0000000000000000000000000000000000000000)
              echo "no previous commit to diff against — building every block"
              python3 tools/mixamo-plan.py tools/mixamo-inbox.txt /tmp/plan ;;
            *)
              python3 tools/mixamo-plan.py tools/mixamo-inbox.txt /tmp/plan --since "$before"
              echo "edited=yes" >> "$GITHUB_OUTPUT" ;;
          esac
          n=$(ls /tmp/plan 2>/dev/null | wc -l)
          echo "blocks=$n" >> "$GITHUB_OUTPUT"

      - name: Install Blender
        if: steps.plan.outputs.blocks != '0'
        run: |
          sudo apt-get update -qq
          # python3-numpy explicitly: Ubuntu's blender runs on the system
          # python and its FBX importer imports numpy at module load, but
          # the runner image installs without recommended packages, so it
          # is not pulled in and every import dies before reading a byte.
          sudo apt-get install -y -qq blender python3-numpy >/dev/null
          blender --version | head -1
          blender --background --python-expr "import numpy; print('numpy', numpy.__version__)" 2>&1 | grep numpy
          npm install -g --silent @gltf-transform/cli
          # gdown, not curl: every one of these files is well over the 25MB
          # where Drive stops serving bytes and starts serving a virus-scan
          # interstitial. curl would fetch that HTML page perfectly happily.
          pip install -q gdown
          gdown --version || true

      - name: Fetch and build
        if: steps.plan.outputs.blocks != '0'
        env:
          # A block only reaches the plan if this push edited it, so the
          # "already built" skip below has nothing left to protect: it is
          # there to stop a run re-fetching characters nobody asked
          # about, and with --since nobody else is in the plan. Without
          # this, editing a block was a no-op — which is exactly what
          # happened when three clips were added to walker and the run
          # reported success having built nothing.
          REBUILD_ALL: ${{ steps.plan.outputs.edited == 'yes' && '1' || '' }}
        run: |
          set -o pipefail
          failed_any=0
          for block in /tmp/plan/block-*; do
            out=$(head -1 "$block")
            # Already built? Leave it alone. This used to rebuild every
            # block on every run, which meant a hundred megabytes off
            # Drive to add one character — and Drive starts refusing
            # ("you may have had many accesses") long before that is
            # reasonable. It also meant one stale link from three
            # characters ago aborted the run before it reached the new
            # ones. Delete the file to force a rebuild.
            if [ -f "$out" ] && [ "${REBUILD_ALL:-}" != "1" ]; then
              echo "  ..   $out already built — skipped"
              continue
            fi
            echo "::group::$out"
            rm -rf /tmp/fbx && mkdir -p /tmp/fbx
            args=""
            fail=0
            ready=""
            while IFS=$'\t' read -r name id; do
              [ -z "$name" ] && continue
              # The /uc?id= form is the one every gdown understands. Newer
              # versions dropped --fuzzy (it became the default) and older
              # ones need it, so avoid the flag entirely.
              if ! gdown -q "https://drive.google.com/uc?id=$id" -O "/tmp/fbx/$name.bin"; then
                echo "::error::$name — gdown could not download $id"
                fail=1; continue
              fi
              # Drive answers a login page with HTTP 200, so a file arriving
              # is not proof it is the right one. Only report a sharing
              # problem once something has actually been downloaded —
              # blaming sharing for a failed fetch sends people off to
              # re-share files that were never the problem.
              #
              # Three kinds of file are welcome. Mixamo hands out FBX,
              # which needs Blender to become a character. A finished GLB
              # is already a character, and putting one through Blender
              # only risks what it already has, so it goes straight to
              # the optimizer. And a zip is how anything with textures
              # arrives — a Sketchfab download, or a whole collection of
              # trees in one file.
              #
              # Told apart by magic bytes rather than by file name, which
              # on a Drive link is whatever the inbox happened to call
              # it. PK is a zip, glTF is a GLB, Kaydara is an FBX.
              magic=$(head -c 4 "/tmp/fbx/$name.bin")
              size=$(du -h "/tmp/fbx/$name.bin" | cut -f1)
              if [ "$(head -c 2 "/tmp/fbx/$name.bin")" = "PK" ]; then
                printf '  ..   %-18s %-8s zip, unpacking\n' "$name" "$size"
                rm -rf "/tmp/fbx/$name.d" && mkdir -p "/tmp/fbx/$name.d"
                if ! unzip -q "/tmp/fbx/$name.bin" -d "/tmp/fbx/$name.d"; then
                  echo "::error::$name — could not unpack the zip"
                  fail=1; continue
                fi
                # A Sketchfab zip is scene.gltf beside its .bin and a
                # textures/ directory, so the model must be read where it
                # was unpacked — the relative paths inside it are the
                # only way it finds its own textures.
                mapfile -t found < <(find "/tmp/fbx/$name.d" -type f \
                  \( -iname '*.glb' -o -iname '*.gltf' \) | sort)
                if [ "${#found[@]}" -eq 0 ]; then
                  echo "::error::$name — the zip holds no .glb or .gltf"
                  find "/tmp/fbx/$name.d" -type f | head -20
                  fail=1; continue
                fi
                if [ "${#found[@]}" -eq 1 ]; then
                  printf '  ok   %-18s %-8s one model in the zip\n' "$name" "$size"
                  ready="${found[0]}"
                else
                  # A collection. Merged into one file, which is the shape
                  # plantpack.glb already has and the shape plantSpecies()
                  # wants: it plants by mesh-name prefix out of a single
                  # scene. gltf-transform puts each input in a Scene of
                  # its own, and three.js loads only the default one — so
                  # a twelve-tree collection would arrive as one tree and
                  # eleven silent absences, with no error and a valid
                  # file. flatten-scenes.mjs is what stops that.
                  printf '  ok   %-18s %-8s %d models, merging\n' \
                    "$name" "$size" "${#found[@]}"
                  printf '         %s\n' "${found[@]#/tmp/fbx/$name.d/}"
                  gltf-transform merge "${found[@]}" "/tmp/fbx/$name.merged.glb"
                  node tools/flatten-scenes.mjs "/tmp/fbx/$name.merged.glb"
                  ready="/tmp/fbx/$name.merged.glb"
                fi
              elif head -c 20 "/tmp/fbx/$name.bin" | grep -q "Kaydara"; then
                printf '  ok   %-18s %-8s fbx\n' "$name" "$size"
                mv "/tmp/fbx/$name.bin" "/tmp/fbx/$name.fbx"
                args="$args /tmp/fbx/$name.fbx"
              elif [ "$magic" = "glTF" ]; then
                # Two finished characters in one block cannot both become
                # one file. Keeping the last silently would build the
                # wrong person and pass, which is worse than stopping.
                if [ -n "$ready" ]; then
                  echo "::error::$out lists more than one finished GLB. Each is already a"
                  echo "::error::whole character, so they cannot be combined — give them"
                  echo "::error::separate '# out:' blocks."
                  fail=1; continue
                fi
                printf '  ok   %-18s %-8s glb, already built\n' "$name" "$size"
                ready="/tmp/fbx/$name.bin"
              else
                echo "::error::$name downloaded but is neither an FBX nor a GLB —"
                echo "::error::share it as 'Anyone with the link' and check it is a model"
                fail=1
              fi
            done < <(tail -n +2 "$block")
            # One block failing must not take the others with it. The
            # run still goes red at the end — a link that has gone stale
            # is worth knowing about — but the characters that CAN be
            # built get built.
            if [ "$fail" = 1 ]; then
              echo "::error::$out — skipped, see above"
              failed_any=1
              echo "::endgroup::"
              continue
            fi

            mkdir -p "$(dirname "$out")"
            if [ -n "$ready" ]; then
              # A finished character: nothing to assemble, only to shrink.
              if [ -n "$args" ]; then
                echo "::error::$out mixes a finished GLB with FBX clips, which cannot be"
                echo "::error::combined here — the GLB carries its own skeleton. Give them"
                echo "::error::separate '# out:' blocks."
                exit 1
              fi
              # Not cp. Out of a zip this is often scene.gltf beside its
              # .bin and a textures/ directory, and copying the one file
              # would leave the geometry and every texture behind. copy
              # reads it where it lies and writes a self-contained GLB.
              gltf-transform copy "$ready" "$out"
              # A character-creator export carries a full anatomy — a
              # tongue, teeth, fingernails, the wet films over the eyes —
              # and each one has its own material and so its own draw
              # call. None of it resolves on a figure crossing a quad.
              # This must run here rather than by hand afterwards: the
              # courier rebuilds from Drive, and it has already silently
              # undone one hand-thinned model (stu_woman, 2.66MB back up
              # to 4.76MB) by doing exactly that. On anything without a
              # face it matches nothing and says so.
              node tools/thin-character.mjs "$out"
              # Only the heavy ones. Character-creator people arrive at
              # 80k triangles and up, several times what the hand-built
              # characters cost, and halving them is invisible at campus
              # distance. A tree collection is not that: plantpack is 211
              # triangles for eight meshes, and simplifying foliage eats
              # the leaf cards that make it read as foliage. So the
              # threshold decides, not the filename.
              tris=$(node -e '
                const fs=require("fs");const b=fs.readFileSync(process.argv[1]);
                const j=JSON.parse(b.slice(20,20+b.readUInt32LE(12)).toString("utf8"));
                console.log(Math.round((j.meshes||[]).reduce((t,m)=>t+m.primitives
                  .reduce((s,p)=>s+(p.indices!==undefined?j.accessors[p.indices].count/3:0),0),0)));
              ' "$out")
              if [ "$tris" -gt 60000 ]; then
                echo "  .. $tris triangles — simplifying"
                gltf-transform simplify "$out" "$out" --ratio 0.45 --error 0.003
              else
                echo "  .. $tris triangles — light enough, left alone"
              fi
            else
              blender --background --python-exit-code 1 \
                      --python tools/mixamo-to-glb.py -- "$out" $args
            fi

            before=$(stat -c%s "$out")
            # A character assembled here from Mixamo parts is one of the
            # named cast, met at conversational distance, and keeps 1024.
            # Anything arriving finished is crowd or scenery, seen across
            # a lawn, and 512 is indistinguishable there — a difference
            # worth 2.5MB across two of them, which this workflow put
            # back the first time it rebuilt models that had been shrunk
            # by hand.
            tex=1024
            [ -n "$ready" ] && tex=512
            # Textures and vertex data only. Simplification rewrites the
            # mesh and takes the skin weights with it, and joining merges
            # the nodes the skeleton is bound to — either one turns a
            # walking student into a bag of knots.
            # Anything arriving with KHR_materials_pbrSpecularGlossiness
            # is arriving white: the extension is deprecated in glTF and
            # GLTFLoader does not read it, so every diffuse texture in
            # the file is ignored and the material falls back to plain
            # colour. Three models shipped that way, one of them with
            # fifteen images that had never been drawn. A no-op on
            # anything already metallic-roughness, so it just runs.
            if node -e '
              const fs=require("fs");const b=fs.readFileSync(process.argv[1]);
              const j=JSON.parse(b.slice(20,20+b.readUInt32LE(12)).toString("utf8"));
              process.exit((j.materials||[]).some(m=>m.extensions
                && m.extensions.KHR_materials_pbrSpecularGlossiness)?0:1);
            ' "$out"; then
              echo "  .. specular-glossiness materials — converting so they can be seen"
              # A .glb temp name, not "$out.mr" — gltf-transform picks its
              # output format from the extension, cannot make anything of
              # ".mr", and falls back to glTF+bin. That left 47MB of stray
              # buffer files committed beside two models. The models
              # themselves recovered on the final optimize; the debris did
              # not clean itself up.
              gltf-transform metalrough "$out" /tmp/mr.glb && mv /tmp/mr.glb "$out"
            fi
            gltf-transform optimize "$out" "$out" \
              --compress meshopt --texture-compress webp --texture-size "$tex" \
              --simplify false --join false
            stat -c%s "$out" | xargs -I{} echo "$before {}" \
              | awk '{printf "  %.1fMB -> %.1fMB\n", $1/1e6, $2/1e6}'
            echo "::endgroup::"
          done
          [ "$failed_any" = 1 ] && {
            echo "::error::at least one character could not be fetched"; exit 1; }
          exit 0

      # Rebuilding the same links produces the same bytes, and a run that
      # changed no model has nothing to tell returning visitors. Bumping
      # anyway costs every one of them a fresh 39MB download of a campus
      # they already have — which is exactly the cost the service worker
      # exists to avoid. It happened: commit 7c36c3f is a courier commit
      # whose entire diff is one line of sw.js.
      #
      # The existing "nothing changed" guard could never catch it, because
      # the bump ran first and left sw.js modified, so the commit always
      # had something to commit. Ask the question before touching sw.js.
      - name: Did any model actually change?
        id: changed
        if: steps.plan.outputs.blocks != '0'
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            echo "assets=yes" >> "$GITHUB_OUTPUT"
            git status --porcelain assets
          else
            echo "assets=no" >> "$GITHUB_OUTPUT"
            echo "the rebuild produced the same bytes — no bump, no commit"
          fi

      - name: Bump the cache version
        if: steps.changed.outputs.assets == 'yes'
        run: |
          # assets/ changed, so returning visitors would otherwise keep the
          # old campus forever — and the PR guard would fail the build.
          #
          # Both halves are checked rather than assumed. sed reports no
          # error when its pattern matches nothing, so if the shape of
          # that line in sw.js ever drifts, this step would quietly do
          # nothing, the courier would commit new models against an
          # unchanged VERSION, and every returning visitor would keep
          # serving the old campus out of cache — with the log still
          # printing a VERSION line and looking fine. Failing here is
          # loud and costs one rerun; failing silently is invisible and
          # costs everyone who has already visited.
          cur=$(sed -n 's/^const VERSION = "pembroke-v\([0-9][0-9]*\)";$/\1/p' sw.js)
          case "$cur" in
            '' | *[!0-9]*)
              echo "::error::cannot read a single cache version from sw.js."
              echo "expected one line reading: const VERSION = \"pembroke-vN\";"
              grep -n 'VERSION' sw.js || true
              exit 1 ;;
          esac
          next=$((cur + 1))
          sed -i "s/^const VERSION = \"pembroke-v$cur\";\$/const VERSION = \"pembroke-v$next\";/" sw.js
          got=$(sed -n 's/^const VERSION = "pembroke-v\([0-9][0-9]*\)";$/\1/p' sw.js)
          if [ "$got" != "$next" ]; then
            echo "::error::VERSION did not bump — still pembroke-v$got, wanted pembroke-v$next"
            exit 1
          fi
          # index.html carries the same string as BUILD, printed in the
          # ?debug panel and compared against what the worker reports so
          # a stale cache can be told apart from an unfixed bug. Bumping
          # one without the other makes every page claim to be stale, and
          # check-sw-version.sh fails the next PR for the drift. Checked,
          # not assumed, for the same reason the line above is.
          sed -i "s/^const BUILD = \"pembroke-v$cur\";$/const BUILD = \"pembroke-v$next\";/" index.html
          build=$(sed -n 's/^const BUILD = "pembroke-v\([0-9][0-9]*\)";$/\1/p' index.html)
          if [ "$build" != "$next" ]; then
            echo "::error::index.html BUILD did not bump — still pembroke-v$build, wanted pembroke-v$next"
            exit 1
          fi
          echo "cache version: pembroke-v$cur -> pembroke-v$next"

      - name: Commit
        if: steps.changed.outputs.assets == 'yes'
        run: |
          git config user.name "pembroke-asset-courier"
          git config user.email "actions@users.noreply.github.com"
          git add assets sw.js index.html
          git commit -m "Courier: build $(ls /tmp/plan | grep -c '^block-') character(s) from Mixamo" \
            || { echo "nothing changed"; exit 0; }
          git push origin HEAD:${{ github.ref_name }}

          # A push made with GITHUB_TOKEN deliberately does not trigger
          # workflows — GitHub's guard against a workflow re-triggering
          # itself forever. That means the commit just made, which adds a
          # model and bumps the cache version, would sit on the branch with
          # no checks at all and look merely "not yet run" rather than
          # untested. Ask for the smoke run explicitly; workflow_dispatch
          # through the API is allowed where a push is not.
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/smoke.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}' \
            && echo "asked smoke to run on ${{ github.ref_name }}"
