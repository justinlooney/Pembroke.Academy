name: campus smoke test

# Every push and PR drives the real page in a real browser. The runner has
# no GPU, so this exercises the software-render path — the slowest machine
# the site will ever meet.
on:
  push:
    branches-ignore: [assets-inbox]   # the asset courier branch is not the site
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

# Named once. It keys the browser cache as well as pinning the install,
# and a cache key that could drift from the version it describes would
# hand back the wrong browser without saying so.
env:
  PW_VERSION: '1.56.1'

jobs:
  # Changing a model without bumping the worker's VERSION strands every
  # returning visitor on the old one, and it is invisible to whoever made
  # the change. Cheap to check, so check it.
  cache-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # the guard diffs against the base branch

      - name: Assets changed without a cache bump?
        run: bash tools/check-sw-version.sh "origin/${{ github.base_ref }}"

  # ── the gateway, in its own job ─────────────────────────────────────
  # No browser, no network, no bindings: a fake env.AI hands back the
  # bytes a provider would, and the whole suite is over in a second. It
  # is first in the file because it is the only job that can tell you
  # you are wrong before the coffee finishes.
  #
  # The Worker is the one thing this repository deploys that had no
  # test at all — check-gateway.mjs talks to production, costs real
  # inference, and cannot be pointed at a branch. Everything that is
  # pure logic lives here instead: the schema wall, the origin wall,
  # burst control, prompt boundaries, the streaming transform and its
  # deadlines, and whether the browser and the Worker still agree about
  # who exists and what they may ask for.
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Does the gateway still hold without spending a token?
        run: node tools/check-worker.mjs

  smoke:
    runs-on: ubuntu-latest
    # The campus has grown a cohort: eleven rigged bodies, 19MB of them,
    # all decoded on a software rasterizer, and the crowd check loads
    # the whole thing a second time in a sibling page. The last full run
    # took 17m37s and the next was killed at 20m17s — a timeout, which
    # GitHub reports as "cancelled" and which reads exactly like someone
    # having pushed over it. Raised with room rather than to the line,
    # so the next body added does not cost an evening working out why a
    # green suite went red without a failing check in it.
    #
    # And again: the author's cathedral (355k tris) and Drosdick Hall
    # (300k more, 24MB of textures) joined the campus and the drive
    # crept from 24 minutes through 32 to a kill at 35 — the exact
    # failure the paragraph above describes, suffered a second time by
    # the timeout it set. Same rule, room rather than the line.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # THE BROWSER IS CACHED AND THE STEPS ARE TIMED, and both halves
      # of that matter.
      #
      # `npx playwright install` wedged four times in one afternoon —
      # across both jobs, on unrelated pull requests. The process sits
      # there, the job's whole budget drains behind it, and a fifty
      # minute smoke job dies at fifty minutes having run no checks at
      # all. GitHub reports that as "cancelled", which reads exactly
      # like somebody pushed over it. Roughly 150 minutes of CI went to
      # producing no signal whatsoever.
      #
      # The cache means the usual path never asks the CDN for a browser.
      # The timeouts mean that when it does ask and the answer never
      # comes, it costs minutes and fails as itself — a named step, not
      # a mystery cancellation an hour later.
      - name: Cache the browser
        id: browser
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PW_VERSION }}

      - name: Install Playwright
        timeout-minutes: 6
        run: npm install --no-save --no-audit --no-fund playwright@${{ env.PW_VERSION }}

      # Only on a miss. --with-deps also installs the system libraries
      # the browser needs, which are apt packages rather than cached
      # files — so a cache HIT still has to do that half, below.
      - name: Fetch the browser
        if: steps.browser.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: System libraries for the cached browser
        if: steps.browser.outputs.cache-hit == 'true'
        timeout-minutes: 6
        run: npx playwright install-deps chromium

      # A minute, against a twenty-minute suite, for the one failure the
      # suite cannot see. An animation track addresses a node by name; if
      # the name is wrong it binds to nothing, the file loads without a
      # word of complaint, and the figure stands perfectly still. This
      # repository has already shipped that statue once and diagnosed it
      # in a browser. Names are also what the wardrobe dresses by, so the
      # same read reports which bodies can be re-dressed at all.
      - name: Do the names in the character files line up?
        run: node tools/check-rig-names.mjs

      # assets/site.css is compiled from the classes the page used the
      # day it was built. A class added afterwards simply does nothing —
      # no error, no failed request, just an element quietly missing its
      # styling. This is the only thing that would notice.
      - name: Does every utility class still have a rule?
        run: node tools/check-css.mjs

      - name: Drive the campus
        run: node tools/smoke.mjs

      # Screenshots are evidence, never a verdict — the same rule the test
      # itself follows when a software rasterizer is too slow to paint one.
      # A green run once went red here purely because the artifact service
      # returned 403 finalizing the upload, which says nothing about the
      # campus.
      - name: Keep the evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-*.png
          if-no-files-found: ignore
          retention-days: 14

  # ── the figures, in their own job ───────────────────────────────────
  # Both of these load the campus and then load bodies through it again,
  # and on a software rasterizer that is minutes rather than seconds:
  # measured here at 5m47 and 4m08. They used to sit in front of the
  # smoke job, which turned a 25-minute suite into a 45-minute one and
  # killed it at its own timeout, mid-drive, reported as "cancelled" —
  # the exact failure the note on that timeout warns about, and caused
  # by adding to it rather than by raising it.
  #
  # They have nothing to say to each other or to the drive, so they run
  # beside it. The wall clock is then the longer of the two jobs rather
  # than their sum, and neither one's budget is spent on the other.
  figures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # THE BROWSER IS CACHED AND THE STEPS ARE TIMED, and both halves
      # of that matter.
      #
      # `npx playwright install` wedged four times in one afternoon —
      # across both jobs, on unrelated pull requests. The process sits
      # there, the job's whole budget drains behind it, and a fifty
      # minute smoke job dies at fifty minutes having run no checks at
      # all. GitHub reports that as "cancelled", which reads exactly
      # like somebody pushed over it. Roughly 150 minutes of CI went to
      # producing no signal whatsoever.
      #
      # The cache means the usual path never asks the CDN for a browser.
      # The timeouts mean that when it does ask and the answer never
      # comes, it costs minutes and fails as itself — a named step, not
      # a mystery cancellation an hour later.
      - name: Cache the browser
        id: browser
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PW_VERSION }}

      - name: Install Playwright
        timeout-minutes: 6
        run: npm install --no-save --no-audit --no-fund playwright@${{ env.PW_VERSION }}

      # Only on a miss. --with-deps also installs the system libraries
      # the browser needs, which are apt packages rather than cached
      # files — so a cache HIT still has to do that half, below.
      - name: Fetch the browser
        if: steps.browser.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: System libraries for the cached browser
        if: steps.browser.outputs.cache-hit == 'true'
        timeout-minutes: 6
        run: npx playwright install-deps chromium

      # Students with no idle clip stand by holding one frame of their
      # walk, with breathe() adding a rise and a sway on top. That offset
      # used to accumulate — every body in the cast rotated its head a
      # full 180° inside a minute, which reached the live site as heads
      # rolling round and round. The drive cannot see it: it runs a few
      # seconds against a software rasterizer, and the fault grew with
      # frame rate, so it was faintest exactly where we were looking.
      # This holds a figure in a LENT pose for a simulated minute at
      # 60fps instead — lent, because the pose a student is held in does
      # not exist in any file on disk, which is how the previous version
      # of this check came to be testing nothing at all.
      - name: Does a standing figure stay where it was put?
        run: node tools/check-breath.mjs

      # Every clip a body wears is LENT — asked for by name, gated on
      # shape, then handed over. rolesOf then measured the merged list
      # back from scratch and decided for itself what each one was: two
      # answers to one question. A role is a pose somebody stands in on
      # the quad and it exists in no file on disk, only in memory after
      # the lending — which is why a broken idle went out on all twelve
      # bodies and came back from a phone as "they just swing around
      # their torso", with nothing in CI having an opinion.
      - name: Is every lent clip doing the job it was lent for?
        run: node tools/check-roles.mjs

      # The plan parks students at doors and on the plaza, stepStudents
      # never steps a static figure, and whatever pose the build leaves
      # is the pose they hold for the whole visit — right where a
      # visitor walks up close. The stance picker took animations[0] on
      # faith, and on an authored body animations[0] is the lent
      # "Stand To Sit": a loiterer LOOPED it at a door ("stuck in a
      # sitting down over and over again") and Priya froze 0.7s into
      # it, mid-bow, on the plaza. This measures the parked skeletons —
      # head near the top, hips near half height, seated only where the
      # plan seats them.
      - name: Is everybody parked somewhere standing like a person?
        run: node tools/check-stance.mjs

  # ── the ledger, in its own job ──────────────────────────────────────
  # Same argument as the figures above, learned the same way. These
  # checks need four page loads of their own, and folded into the drive
  # they took a 25-minute suite to 37 and timed out two checks that pass
  # in twenty-four seconds on a quiet machine — a false red accusing a
  # fix that works, which is the most expensive kind. Beside the drive
  # they cost ninety seconds and answer for themselves.
  #
  # What they cover is what a screenshot cannot: a stored ledger with
  # one bad field used to stop the campus igniting at all, and a seal
  # taken out of order used to confer the degree without a lecture.
  # Neither one looks like a fault from outside.
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache the browser
        id: browser
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PW_VERSION }}

      - name: Install Playwright
        timeout-minutes: 6
        run: npm install --no-save --no-audit --no-fund playwright@${{ env.PW_VERSION }}

      - name: Fetch the browser
        if: steps.browser.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: System libraries for the cached browser
        if: steps.browser.outputs.cache-hit == 'true'
        timeout-minutes: 6
        run: npx playwright install-deps chromium

      - name: Does a bad ledger cost a field or the university?
        run: node tools/check-ledger.mjs

  # ── can this campus be used without a mouse? ────────────────────────
  # The drive runs at one desktop viewport with a pointer, so the two
  # classes of defect that have hurt this repository most — the
  # mobile-only ones (#66, #67) and the accessibility-only ones (#71) —
  # are precisely the two it cannot see. This job is the gate that was
  # missing while both of them shipped.
  #
  # Three browsers, because the interesting cases are media queries: a
  # desktop, a Pixel 5, and a visitor who has asked the system to stop
  # moving things. axe-core runs over the campus, the journey dialog
  # and the phone; the rest are questions axe cannot ask — whether the
  # focus ring is the campus's own or the browser's, whether the modal
  # is as modal as it claims, and whether a person can be reached
  # without pointing at them.
  #
  # Beside the drive, not inside it, for the reason this file has now
  # written down three times: it needs five page loads of its own and
  # the drive already takes twenty-five minutes. This one is 2m36.
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache the browser
        id: browser
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PW_VERSION }}

      # both in one npm install: installing them in two calls prunes the
      # package the first one added, because nothing here is saved
      - name: Install Playwright and axe-core
        timeout-minutes: 6
        run: npm install --no-save --no-audit --no-fund playwright@${{ env.PW_VERSION }} axe-core

      - name: Fetch the browser
        if: steps.browser.outputs.cache-hit != 'true'
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: System libraries for the cached browser
        if: steps.browser.outputs.cache-hit == 'true'
        timeout-minutes: 6
        run: npx playwright install-deps chromium

      - name: Can this campus be used without a mouse?
        run: node tools/check-a11y.mjs
