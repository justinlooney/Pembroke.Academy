name: campus smoke test

# Every push and PR drives the real page in a real browser. The runner has
# no GPU, so this exercises the software-render path — the slowest machine
# the site will ever meet.
on:
  push:
    branches-ignore: [assets-inbox]   # the asset courier branch is not the site
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Changing a model without bumping the worker's VERSION strands every
  # returning visitor on the old one, and it is invisible to whoever made
  # the change. Cheap to check, so check it.
  cache-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # the guard diffs against the base branch

      - name: Assets changed without a cache bump?
        run: bash tools/check-sw-version.sh "origin/${{ github.base_ref }}"

  smoke:
    runs-on: ubuntu-latest
    # The campus has grown a cohort: eleven rigged bodies, 19MB of them,
    # all decoded on a software rasterizer, and the crowd check loads
    # the whole thing a second time in a sibling page. The last full run
    # took 17m37s and the next was killed at 20m17s — a timeout, which
    # GitHub reports as "cancelled" and which reads exactly like someone
    # having pushed over it. Raised with room rather than to the line,
    # so the next body added does not cost an evening working out why a
    # green suite went red without a failing check in it.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      # A minute, against a twenty-minute suite, for the one failure the
      # suite cannot see. An animation track addresses a node by name; if
      # the name is wrong it binds to nothing, the file loads without a
      # word of complaint, and the figure stands perfectly still. This
      # repository has already shipped that statue once and diagnosed it
      # in a browser. Names are also what the wardrobe dresses by, so the
      # same read reports which bodies can be re-dressed at all.
      - name: Do the names in the character files line up?
        run: node tools/check-rig-names.mjs

      - name: Drive the campus
        run: node tools/smoke.mjs

      # Screenshots are evidence, never a verdict — the same rule the test
      # itself follows when a software rasterizer is too slow to paint one.
      # A green run once went red here purely because the artifact service
      # returned 403 finalizing the upload, which says nothing about the
      # campus.
      - name: Keep the evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-*.png
          if-no-files-found: ignore
          retention-days: 14
