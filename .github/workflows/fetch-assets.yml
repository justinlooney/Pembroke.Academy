name: fetch-assets
# Courier workflow: runs on GitHub's servers (which have open internet),
# pulls the campus models from Google Drive share links, and commits them
# to this branch so the development sandbox can fetch them over git.
# The branch is temporary and gets deleted once assets are extracted.
on:
  push:
    branches: [assets-inbox]
permissions:
  contents: write
concurrency: fetch-assets
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gdown in a clean venv
        run: |
          python3 -m venv /tmp/gd
          /tmp/gd/bin/pip install -q "gdown>=5"
          /tmp/gd/bin/gdown --version
      - name: Download models from Google Drive
        run: |
          mkdir -p incoming
          rm -f incoming/FETCH_ERRORS.txt
          fetch(){
            /tmp/gd/bin/gdown --fuzzy "https://drive.google.com/file/d/$2/view" -O "incoming/$1" || true
            if [ ! -s "incoming/$1" ] || head -c 300 "incoming/$1" | grep -qi "<html"; then
              echo "gdown failed for $1, trying direct endpoint..."
              curl -sSL "https://drive.usercontent.google.com/download?id=$2&export=download&confirm=t" -o "incoming/$1" || true
            fi
            size=$(stat -c%s "incoming/$1" 2>/dev/null || echo 0)
            if [ "$size" -lt 5000 ] || head -c 300 "incoming/$1" | grep -qi "<html"; then
              echo "$1 ($2): download invalid (size=$size)" >> incoming/FETCH_ERRORS.txt
              rm -f "incoming/$1"
            fi
          }
          fetch university.glb 1Cz4iwhf4Vbt6tAV4ZpRXoWOZ6JMQBad4
          ls -la incoming
          sha256sum incoming/* > incoming/MANIFEST.txt || true
      - name: Shrink oversized models
        run: |
          need=0
          for f in incoming/*.glb; do
            [ -f "$f" ] || continue
            if [ "$(stat -c%s "$f")" -gt 90000000 ]; then need=1; fi
          done
          if [ "$need" = 1 ]; then
            npm install -g @gltf-transform/cli
            for f in incoming/*.glb; do
              [ -f "$f" ] || continue
              size=$(stat -c%s "$f")
              if [ "$size" -gt 90000000 ]; then
                echo "compressing $f ($size bytes)"
                gltf-transform optimize "$f" "${f%.glb}.opt.glb" --compress meshopt --texture-compress webp --texture-size 2048 && mv "${f%.glb}.opt.glb" "$f" || rm -f "${f%.glb}.opt.glb"
              fi
            done
          fi
      - name: Commit results
        run: |
          git config user.name "pembroke-asset-courier"
          git config user.email "actions@users.noreply.github.com"
          git add incoming
          git commit -m "Courier: fetch models from Drive" || echo "nothing new"
          git push
