name: idle

# Land a standing idle on every body whose skeleton can take one.
#
# Most of the cohort arrived carrying a single walk cycle, so a student
# who stops has nothing to stop INTO. index.html handles that by holding
# the walk at the frame where the feet pass, which works on any
# skeleton — but a real idle, where the bones line up for one, is
# better: weight shifts, a settle through the arms, a head that moves.
#
# It only lines up on the Mixamo-named bodies. The Character Creator
# ones call the same bone CC_Base_Spine01 and the clip would address
# nothing, so add-idle.py refuses them and they keep the held frame.
# That refusal is the point: a clip that binds to nothing exports
# perfectly and ships a statue.
# Run by hand only. This fired on any push touching the tool or this
# file, which meant editing either one re-landed the clip on four
# bodies and pushed the result to main unreviewed. It did that three
# times in one afternoon, and what landed was not three copies of one
# animation but three DIFFERENT truncations of it — 6.02s, then 0.37s,
# then 0.95s, all named Idle — with index.html picking whichever sorted
# first. A third of a second of a standing loop, played on repeat, is
# what "everyone is swaying around" looks like.
#
# A workflow that writes character assets straight to the branch needs
# somebody to look at the result before it ships. Nothing here can tell
# a good landing from a bad one, and the bad ones were visible from the
# first frame and invisible in every log.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency: mixamo          # shares the courier's lane; both write assets/

jobs:
  idle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy >/dev/null
          blender --version | head -1
          npm install -g --silent @gltf-transform/cli

      - name: Land the clip
        id: work
        run: |
          set -o pipefail
          CLIP=tools/clips/Standing_Idle.fbx
          changed=0
          # Every body that came with one walk cycle. The three Character
          # Creator ones are listed too, on purpose: the tool decides,
          # not this file, and its refusal is logged where it can be read.
          for name in stu_gent stu_mia stu_teen stu_oreizo \
                      stu_alina stu_ariel stu_woman stu_nathan; do
            src="assets/$name.glb"
            [ -f "$src" ] || continue
            echo "::group::$name"
            # Blender cannot read EXT_meshopt_compression, which every
            # asset here uses. Decode a working copy first.
            gltf-transform copy "$src" "/tmp/$name.in.glb"
            if blender --background --python-exit-code 1 --python tools/add-idle.py -- \
                 "/tmp/$name.out.glb" "/tmp/$name.in.glb" "$CLIP" Idle 2>&1 \
                 | grep -vE '^Fra:|^WARNING|^Blender quit|^Read prefs'; then
              # Straight back to the shape the campus ships: meshopt,
              # webp, 512. Skipping this would quietly undo the courier's
              # work, which has already happened twice in this repo.
              gltf-transform optimize "/tmp/$name.out.glb" "$src" \
                --compress meshopt --texture-compress webp --texture-size 512 \
                --simplify false --join false
              echo "  landed on $name"
              changed=1
            else
              # Two different non-zero exits land here, and the log above
              # says which: the tool refuses a skeleton the clip cannot
              # address (2 of 3 bodies), and it declines a body that
              # already carries the clip. Both mean "leave the file
              # alone", which is why neither sets changed.
              echo "  $name unchanged — see the group above for why"
            fi
            echo "::endgroup::"
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Did any model actually change?
        id: diff
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            echo "assets=yes" >> "$GITHUB_OUTPUT"; git status --porcelain assets
          else
            echo "assets=no" >> "$GITHUB_OUTPUT"
            echo "no body took the clip — nothing to commit, no bump"
          fi

      - name: Bump the cache version
        if: steps.diff.outputs.assets == 'yes'
        run: |
          cur=$(sed -n 's/^const VERSION = "pembroke-v\([0-9][0-9]*\)";$/\1/p' sw.js)
          case "$cur" in '' | *[!0-9]*)
            echo "::error::cannot read a single cache version from sw.js"; exit 1 ;;
          esac
          next=$((cur + 1))
          sed -i "s/^const VERSION = \"pembroke-v$cur\";\$/const VERSION = \"pembroke-v$next\";/" sw.js
          got=$(sed -n 's/^const VERSION = "pembroke-v\([0-9][0-9]*\)";$/\1/p' sw.js)
          [ "$got" = "$next" ] || { echo "::error::VERSION did not bump"; exit 1; }
          echo "cache version: pembroke-v$cur -> pembroke-v$next"

      - name: Commit
        if: steps.diff.outputs.assets == 'yes'
        run: |
          git config user.name "pembroke-asset-courier"
          git config user.email "actions@users.noreply.github.com"
          git add assets sw.js
          git commit -m "Courier: land a standing idle on the bodies that can take it" \
            || { echo "nothing changed"; exit 0; }
          git push origin HEAD:${{ github.ref_name }}
          # A GITHUB_TOKEN push does not trigger workflows, so the commit
          # would sit there with no checks and look merely "not yet run".
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/smoke.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}' \
            && echo "asked smoke to run on ${{ github.ref_name }}"
